<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Pet Simulator</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222c; --line: #2a2f3a;
    --ink: #e6e9ef; --dim: #99a2b2; --accent: #5db0ff;
    --ok: #47c26b; --warn: #e0a23c; --err: #e5604d; --cmd: #b58cff; --tel: #6f7787;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .meta { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; gap: 0; height: calc(100vh - 47px); }
  #devices { overflow-y: auto; padding: 14px; border-right: 1px solid var(--line); }
  #logwrap { display: flex; flex-direction: column; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .sub { color: var(--dim); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-bottom: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tel); flex: none; }
  .dot.online { background: var(--ok); } .dot.offline { background: var(--err); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row + .row { margin-top: 8px; }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line);
    padding: 5px 11px; border-radius: 7px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #22334a; border-color: #33507a; }
  button.armed { background: #4a2f2c; border-color: #7a3a33; color: #ffd9d2; }
  input[type=number] { width: 62px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  label.fld { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .faults { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); }
  .faults .lbl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel); }
  .toolbar input[type=text] { flex: 1; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
  #log { flex: 1; overflow-y: auto; padding: 6px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; }
  .ev { padding: 3px 14px; border-bottom: 1px solid #20242e; white-space: pre-wrap; word-break: break-word; }
  .ev .t { color: var(--tel); } .ev .topic { color: var(--dim); }
  .ev.command .topic { color: var(--cmd); } .ev.ack .topic { color: var(--accent); }
  .ev.event .topic { color: var(--warn); } .ev.status .topic { color: var(--ok); }
  .ev .body { color: var(--ink); }
  .ev.command .body { color: #d8c6ff; }
  .pill { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
</style>
</head>
<body>
<header>
  <h1>Smart Pet Simulator</h1>
  <span class="meta" id="meta">connecting...</span>
  <span class="meta" id="count"></span>
</header>
<main>
  <section id="devices"></section>
  <section id="logwrap">
    <div class="toolbar">
      <input type="text" id="filter" placeholder="filter by topic or text" />
      <button id="pause">Pause</button>
      <button id="clear">Clear</button>
      <span class="pill" id="rate">0/s</span>
    </div>
    <div id="log"></div>
  </section>
</main>
<script>
const CMDS = {
  feeder: [{ label: 'Feed', cmd: 'feed', num: { key: 'grams', val: 25 } }],
  water:  [{ label: 'Dispense', cmd: 'dispense', num: { key: 'seconds', val: 4 } }],
  door:   [{ label: 'Open', cmd: 'door', params: { action: 'open' } },
           { label: 'Close', cmd: 'door', params: { action: 'close' } }],
  gps:    [{ label: 'Get location', cmd: 'get_location' }],
  scale:  [{ label: 'Tare', cmd: 'tare' },
           { label: 'Mark meal', cmd: 'mark_meal' },
           { label: 'Measure consumed', cmd: 'measure_consumed' }],
  sensor: [],
};
const TYPE_FAULT = { feeder: 'jam', water: 'no_flow', door: 'stuck_door', sensor: 'drift_high', gps: 'battery_drain' };

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) n.append(k);
  return n;
};

let devices = [];
const armed = {}; // deviceId -> Set of active faults

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return r.json().catch(() => ({}));
}

function sendCommand(dev, spec, numInput) {
  const params = { ...(spec.params || {}) };
  if (spec.num && numInput) params[spec.num.key] = Number(numInput.value);
  post('/publish', {
    topic: `kennel/${dev.kennelId}/${dev.deviceType}/${dev.deviceId}/command`,
    payload: {
      deviceId: dev.deviceId, kennelId: dev.kennelId, timestamp: Date.now(),
      command: spec.cmd, id: 'web-' + Math.random().toString(36).slice(2, 8),
      params: Object.keys(params).length ? params : undefined,
    },
  });
}

function toggleFault(dev, name, btn) {
  const set = (armed[dev.deviceId] ||= new Set());
  const on = !set.has(name);
  on ? set.add(name) : set.delete(name);
  btn.classList.toggle('armed', on);
  post('/fault', { deviceId: dev.deviceId, fault: name, on });
}

function renderDevices() {
  const box = $('#devices');
  box.textContent = '';
  for (const dev of devices) {
    const card = el('div', { className: 'card', id: 'dev-' + dev.deviceId });
    card.append(
      el('h2', {}, el('span', { className: 'dot', id: 'dot-' + dev.deviceId }), dev.name || dev.deviceId),
      el('div', { className: 'sub' }, `${dev.deviceType}  ${dev.deviceId}`),
    );

    const specs = CMDS[dev.deviceType] || [];
    if (specs.length) {
      const row = el('div', { className: 'row' });
      for (const spec of specs) {
        let numInput = null;
        if (spec.num) {
          numInput = el('input', { type: 'number', value: spec.num.val, min: 0 });
          row.append(el('label', { className: 'fld' }, spec.num.key, numInput));
        }
        row.append(el('button', { className: 'primary', onclick: () => sendCommand(dev, spec, numInput) }, spec.label));
      }
      card.append(row);
    } else {
      card.append(el('div', { className: 'sub' }, 'no commands (telemetry only)'));
    }

    const faults = el('div', { className: 'faults' }, el('div', { className: 'lbl' }, 'faults'));
    const frow = el('div', { className: 'row' });
    const list = [];
    if (TYPE_FAULT[dev.deviceType]) list.push(TYPE_FAULT[dev.deviceType]);
    list.push('offline');
    for (const name of list) {
      const btn = el('button', { textContent: name });
      btn.onclick = () => toggleFault(dev, name, btn);
      frow.append(btn);
    }
    faults.append(frow);
    card.append(faults);
    box.append(card);
  }
}

function setDot(deviceId, state) {
  const d = $('#dot-' + deviceId);
  if (d) d.className = 'dot ' + state;
}

// ---- live log ----
const LOG = $('#log');
let paused = false, buffer = [], seen = 0, lastSecond = Math.floor(Date.now() / 1000), perSec = 0;

function leafOf(topic) { return topic.split('/').pop(); }

function classify(topic) {
  const leaf = leafOf(topic);
  if (leaf === 'command') return 'command';
  if (leaf === 'ack') return 'ack';
  if (leaf === 'event') return 'event';
  if (leaf === 'status') return 'status';
  return 'telemetry';
}

function addRow({ topic, payload, ts }) {
  const kind = classify(topic);
  if (kind === 'status') {
    try {
      const p = JSON.parse(payload);
      setDot(topic.split('/')[3], p.status === 'offline' ? 'offline' : 'online');
    } catch {}
  }
  const filter = $('#filter').value.trim().toLowerCase();
  if (filter && !(topic.toLowerCase().includes(filter) || payload.toLowerCase().includes(filter))) return;

  const short = topic.replace(/^kennel\//, '');
  const time = new Date(ts).toTimeString().slice(0, 8);
  const row = el('div', { className: 'ev ' + kind });
  row.append(
    el('span', { className: 't' }, time + '  '),
    el('span', { className: 'topic' }, short + '  '),
    el('span', { className: 'body' }, payload),
  );
  LOG.prepend(row);
  while (LOG.childElementCount > 400) LOG.lastElementChild.remove();
}

function tick(msg) {
  const now = Math.floor(Date.now() / 1000);
  if (now !== lastSecond) { $('#rate').textContent = perSec + '/s'; perSec = 0; lastSecond = now; }
  perSec++;
  if (paused) { buffer.push(msg); if (buffer.length > 400) buffer.shift(); return; }
  addRow(msg);
}

$('#pause').onclick = (e) => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume' : 'Pause';
  e.target.classList.toggle('primary', paused);
  if (!paused) { buffer.forEach(addRow); buffer = []; }
};
$('#clear').onclick = () => (LOG.textContent = '');

const es = new EventSource('/events');
es.onmessage = (e) => { try { tick(JSON.parse(e.data)); } catch {} };
es.onerror = () => ($('#meta').textContent = 'stream lost, retrying...');

// ---- boot ----
(async () => {
  const info = await fetch('/devices').then((r) => r.json());
  devices = info.devices || [];
  $('#meta').textContent = `broker ${info.broker}`;
  $('#count').textContent = `${devices.length} devices`;
  renderDevices();
})();
</script>
</body>
</html>
